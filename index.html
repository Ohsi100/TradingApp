<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0E14">
  <meta name="description" content="Private Lern-App: Swing-Trading-Grundlagen in 10 Tagen">
  <title>Trading-Lernapp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="lib/ionic/ionic.bundle.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script>window.Ionic = { config: { mode: 'md', animated: true } };</script>
  <script src="version.js"></script>
  <script type="module" src="lib/ionic/ionic.esm.js"></script>
</head>
<body>
  <ion-app>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button id="zurueck" class="zurueck-knopf" aria-label="Zurück" hidden></ion-button>
        </ion-buttons>
        <ion-title id="titel">Trading-Lernapp</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content id="inhalt">
      <main id="app" class="inhalt"></main>
    </ion-content>

    <ion-footer>
      <ion-tab-bar id="tabbar" selected-tab="plan"></ion-tab-bar>
    </ion-footer>
  </ion-app>

  <script type="module" src="js/app.js"></script>
</body>
</html>
